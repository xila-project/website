name: Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  documentation:
    name: Documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Setup | Checkout documentation"
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: "Setup | Node and locked dependencies"
        uses: xila-project/workspace/.github/actions/setup-node@0adf14f42ce3bb004b2fe6e7e66be813abda9666

      - name: "Setup | Checkout core references"
        uses: actions/checkout@v5
        with:
          repository: xila-project/core
          ref: main
          path: .reference-checkouts/core
          fetch-depth: 1
          persist-credentials: false

      - name: "Setup | Checkout applications references"
        uses: actions/checkout@v5
        with:
          repository: xila-project/applications
          ref: main
          path: .reference-checkouts/applications
          fetch-depth: 1
          persist-credentials: false

      - name: "Setup | Checkout platforms references"
        uses: actions/checkout@v5
        with:
          repository: xila-project/platforms
          ref: main
          path: .reference-checkouts/platforms
          fetch-depth: 1
          persist-credentials: false

      - name: "Setup | Checkout package manager references"
        uses: actions/checkout@v5
        with:
          repository: xila-project/package_manager
          ref: main
          path: .reference-checkouts/package_manager
          fetch-depth: 1
          persist-credentials: false

      - name: "Setup | Checkout registry references"
        uses: actions/checkout@v5
        with:
          repository: xila-project/registry
          ref: main
          path: .reference-checkouts/registry
          fetch-depth: 1
          persist-credentials: false

      - name: "Validate | Documentation and references"
        env:
          XILA_STRICT_SOURCE_REFERENCES: "1"
          XILA_CORE_PATH: ${{ github.workspace }}/.reference-checkouts/core
          XILA_APPLICATIONS_PATH: ${{ github.workspace }}/.reference-checkouts/applications
          XILA_PLATFORMS_PATH: ${{ github.workspace }}/.reference-checkouts/platforms
          XILA_PACKAGE_MANAGER_PATH: ${{ github.workspace }}/.reference-checkouts/package_manager
          XILA_REGISTRY_PATH: ${{ github.workspace }}/.reference-checkouts/registry
        run: mise exec -- npm run check

  rustdoc:
    name: Host and Guest Rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MISE_ENV: ci
      CARGO_TERM_COLOR: always
      XILA_STRICT_RUSTDOC: "1"
      XILA_CORE_PATH: ${{ github.workspace }}/.reference-checkouts/core
      XILA_APPLICATIONS_PATH: ${{ github.workspace }}/.reference-checkouts/applications
    steps:
      - name: "Setup | Checkout documentation"
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: "Setup | Checkout core references"
        uses: actions/checkout@v5
        with:
          repository: xila-project/core
          ref: main
          path: .reference-checkouts/core
          fetch-depth: 1
          persist-credentials: false

      - name: "Setup | Checkout applications references"
        uses: actions/checkout@v5
        with:
          repository: xila-project/applications
          ref: main
          path: .reference-checkouts/applications
          fetch-depth: 1
          persist-credentials: false

      - name: "Setup | Rust toolchain and build cache"
        uses: xila-project/workspace/.github/actions/setup-rust@0adf14f42ce3bb004b2fe6e7e66be813abda9666
        with:
          toolchain-task: ci:rustdoc-toolchain
          cache-mode: objects
          cache-generation: v1-website-rustdoc
          working-directory: .reference-checkouts/core

      - name: "Setup | Core native packages"
        run: mise run ci:rustdoc-packages

      - name: "Build | Host and Guest Rustdoc"
        run: mise run documentation:rustdoc

  required:
    if: always()
    needs: [documentation, rustdoc]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Gate | Verify mandatory checks"
        env:
          DOCUMENTATION: ${{ needs.documentation.result }}
          RUSTDOC: ${{ needs.rustdoc.result }}
        run: test "$DOCUMENTATION" = success && test "$RUSTDOC" = success
