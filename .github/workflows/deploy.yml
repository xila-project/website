name: Deploy Xila web site to Pages

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: "Setup | Checkout documentation"
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: "Setup | Node and locked dependencies"
        uses: xila-project/workspace/.github/actions/setup-node@0adf14f42ce3bb004b2fe6e7e66be813abda9666
      - name: "Publish | Configure Pages"
        uses: actions/configure-pages@v6

      - name: "Build | Validate documentation"
        run: mise exec -- npm run check
      - name: "Publish | Upload Pages artifact"
        uses: actions/upload-pages-artifact@v5
        with:
          path: .vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: "Publish | Deploy Pages"
        id: deployment
        uses: actions/deploy-pages@v5
