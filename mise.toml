# Toolchains are managed by mise, not floating Node LTS on GitHub runners.
[tools]
node = "24.22.0"

[tasks."documentation:check"]
description = "Validate references, formatting and build the Astro and Starlight documentation"
run = "npm run check"

[tasks."documentation:development"]
description = "Start the Astro local development server"
run = "npm run docs:dev"
